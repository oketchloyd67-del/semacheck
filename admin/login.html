<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — SemaCheck</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frontend/css/style.css">
<meta name="robots" content="noindex, nofollow">
</head>
<body style="background:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;">

<div class="modal" style="max-width:380px;">
  <h2>SemaCheck Admin</h2>
  <p class="sub">Staff access only. This page is not linked from the public site.</p>
  <div id="loginAlert"></div>
  <div class="field"><label>Admin email</label><input type="email" id="adminEmail" placeholder="admin@semacheck.co.ke"></div>
  <div class="field"><label>Password</label><input type="password" id="adminPassword" placeholder="••••••••"></div>
  <button class="btn btn-primary btn-block" id="adminLoginBtn">Log in</button>
</div>

<script src="js/admin.js"></script>
</body>
</html>
