<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — SemaCheck</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="https://semacheck.vercel.app/assets/favicon.png">
<link rel="apple-touch-icon" href="https://semacheck.vercel.app/assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B1F3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-title" content="SemaCheck Admin">
</head>
<body style="background:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;">

<div class="modal" style="max-width:380px;">
  <div class="brand" style="color:var(--navy);justify-content:center;margin-bottom:6px;"><img src="https://semacheck.vercel.app/assets/logo.png" alt="SemaCheck" class="brand-logo"></div>
  <h2>SemaCheck Admin</h2>
  <p class="sub">Staff access only. This page is not linked from the public site.</p>
  <div id="loginAlert"></div>
  <div id="loginStep">
    <div class="field"><label>Admin email</label><input type="email" id="adminEmail" placeholder="you@semacheck.co.ke" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="adminPassword" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn btn-primary btn-block" id="adminLoginBtn">Log in</button>
  </div>

  <div id="twoFactorStep" style="display:none;">
    <p class="sub" id="twoFactorHint"></p>
    <div id="enrollBox" style="display:none;">
      <p class="sub" style="margin-bottom:6px;">Add this secret to Google Authenticator, Authy or 1Password — it is shown only during setup:</p>
      <p id="totpSecret" style="font-family:monospace;font-size:0.85rem;letter-spacing:0.5px;word-break:break-all;background:#f4f6fa;color:var(--navy);padding:10px;border-radius:8px;"></p>
      <p class="sub"><a id="totpLink" href="#">Open in an authenticator app</a></p>
    </div>
    <div class="field"><label>6-digit code</label><input type="text" id="totpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></div>
    <button class="btn btn-primary btn-block" id="verify2faBtn">Verify and sign in</button>
    <button class="btn btn-ghost btn-block" id="restartLoginBtn" style="margin-top:8px;">Use a different account</button>
  </div>
</div>

<script src="js/admin.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
</script>
</body>
</html>
