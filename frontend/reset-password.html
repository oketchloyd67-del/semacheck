<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SemaCheck — Reset your password</title>
  <meta name="description" content="Choose a new password for your SemaCheck account.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>
  <header class="navbar">
    <div class="container" style="justify-content:space-between;">
      <a href="index.html" class="brand" aria-label="SemaCheck — go to the homepage"><img src="assets/logo.png" alt="SemaCheck" class="brand-logo"></a>
      <nav class="subnav">
        <a href="developers.html">Developers</a>
        <a href="alerts.html">Alerts</a>
        <a href="report.html">Report a scam</a>
        <a href="index.html">Log in</a>
      </nav>
    <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main class="container" style="padding:40px 0 80px; max-width:520px;">
    <h1>Choose a new password</h1>
    <p class="hint">This link works once and expires 30 minutes after it was requested.</p>

    <div id="resetCard" style="border:1px solid var(--border); border-radius:10px; padding:24px; margin-top:18px;">
      <div id="resetAlert" aria-live="polite"></div>
      <div id="resetForm" style="display:grid; gap:16px;">
        <div>
          <label for="rpPassword">New password</label>
          <input id="rpPassword" type="password" autocomplete="new-password" placeholder="Create a password" style="width:100%; padding:11px; border:1.5px solid var(--border); border-radius:8px;">
          <div class="strength-meter">
            <div class="strength-bar" id="strengthBar"><div></div><div></div><div></div><div></div></div>
            <div class="strength-label" id="strengthLabel"></div>
            <div class="strength-feedback" id="strengthFeedback"></div>
          </div>
        </div>
        <div>
          <label for="rpPasswordConfirm">Confirm password</label>
          <input id="rpPasswordConfirm" type="password" autocomplete="new-password" placeholder="Re-enter your password" style="width:100%; padding:11px; border:1.5px solid var(--border); border-radius:8px;">
          <div class="field-msg" id="rpConfirmMsg"></div>
        </div>
        <button class="btn btn-primary btn-block" id="rpSubmit"><span id="rpBtnLabel">Update password</span></button>
      </div>
      <div id="resetDone" style="display:none; text-align:center;">
        <div class="alert alert-ok">Password updated.</div>
        <p class="hint" style="margin-top:10px;">You can now log in with your new password.</p>
        <a class="btn btn-primary" href="index.html" style="margin-top:12px;">Go to log in</a>
      </div>
    </div>

    <p class="hint" style="margin-top:18px;">Didn't request this? You can ignore this page — your password stays unchanged.</p>
  </main>

  <script src="js/validation.js"></script>
  <script src="js/reset-password.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
